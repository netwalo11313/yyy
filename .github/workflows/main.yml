name: saif
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 1000

    steps:
      - name: Maximize Virtual Memory
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name "PagingFiles" -Value "C:\pagefile.sys 20000 20000"
          Write-Host "Virtual Memory set to 20GB"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389

      - name: Create User
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1","PasswordComplexity = 0" | Out-File C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force
          $pass = ConvertTo-SecureString "12345678" -AsPlainText -Force
          New-LocalUser -Name "saif1234" -Password $pass -AccountNeverExpires -PasswordNeverExpires -ErrorAction SilentlyContinue
          "Administrators","Remote Desktop Users" | ForEach-Object { Add-LocalGroupMember -Group $_ -Member "saif1234" -ErrorAction SilentlyContinue }

      - name: Start Tailscale
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\ts.exe"
          Start-Process "$env:TEMP\ts.exe" -ArgumentList "/quiet","/norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=windows-bot

      - name: Show IP & Keep Alive
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "::notice title=RDP INFO::IP: $ip | User: saif1234 | Pass: 12345678"
          while ($true) { Start-Sleep 3000 }
