name: Windows Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 1000

    steps:
      - name: Maximize Virtual Memory
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name "PagingFiles" -Value "C:\pagefile.sys 20000 20000"
          Write-Host "Virtual Memory set to 20GB"

      - name: Start Tailscale
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\ts.exe"
          Start-Process "$env:TEMP\ts.exe" -ArgumentList "/quiet","/norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=windows-bot

      - name: Show IP & Keep Alive
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "::notice title=INFO::Tailscale IP: $ip"
          while ($true) { Start-Sleep 3000 }
